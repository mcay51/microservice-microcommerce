spring:
  application:
    name: order-service
  config:
    import: "configserver:" # Config Server'dan konfigürasyonları al
  cloud:
    config:
      uri: http://config-server:8888 # Config Server URL
      fail-fast: true # Bağlantı hatası durumunda uygulama başarısız olsun

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    filter: true
  packages-to-scan: tr.com.mcay.orderservice.controller

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,diskSpace,ping
        liveness:
          include: ping
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
