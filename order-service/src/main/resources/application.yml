spring:
  application:
    name: order-service
  config:
    import: "configserver:" # Config Server'dan konfigürasyonları al
  cloud:
    config:
      uri: http://config-server:8888 # Config Server URL
      fail-fast: true # Bağlantı hatası durumunda uygulama başarısız olsun

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    filter: true
  packages-to-scan: tr.com.mcay.orderservice.controller
